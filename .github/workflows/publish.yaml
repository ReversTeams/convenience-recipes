name: Publish Minecraft Mod

on:
  push:
    tags:
      - "*"

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - run: chmod +x gradlew

      - name: Build Mod
        run: ./gradlew build

      - name: Publish mod files
        uses: tristankechlo/publish-mc-mod@v2.0.0
        with:
          mc-version: "1.20.1"
          mod-version: "1.1.0"
          curseforge-id: 1396136
          modrinth-id: "Br1e4HIn"
          version-range: "[1.20.1,1.20.2)"
          version-type: "release"
          loaders: "forge"
          changelog: |
            - Added recipes to turn rooted and coarse dirt to dirt.
            - Added hanging signs recipes for Hexerei (previously uncraftable).
            - Separated Tag Fixes from Tag Localization Fixes.
            - Universalized the jar.

          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          forge-glob: ./build/libs/*-universal-!(*-dev|*-sources|*-javadoc).jar